name: hamro_deal
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dartz: ^0.10.1
  uuid: ^4.5.2
  equatable: ^2.0.7
  path_provider: ^2.1.5
  flutter_svg: ^2.2.3
  dio: ^5.9.0
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  test_cov_console: ^0.2.2
  light: ^4.1.0
  fl_chart: ^1.1.1
  intl: ^0.20.2
  timeago: ^3.7.1
  font_awesome_flutter: ^10.12.0
  shake: ^3.0.0
  sensors_plus: ^6.1.2
  app_links: ^6.4.1
  device_info_plus: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: OpenSans Bold
      fonts:
        - asset: assets/fonts/OpenSans-Bold.ttf
    - family: OpenSans Italic
      fonts:
        - asset: assets/fonts/OpenSans-Italic.ttf
    - family: OpenSans Regular
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
    - family: Jost Black
      fonts:
        - asset: assets/fonts/Jost-Black.ttf
    - family: Jost Bold
      fonts:
        - asset: assets/fonts/Jost-Bold.ttf
    - family: Jost Medium
      fonts:
        - asset: assets/fonts/Jost-Medium.ttf
    - family: Jost Regular
      fonts:
        - asset: assets/fonts/Jost-Regular.ttf
    - family: Jost SemiBold
      fonts:
        - asset: assets/fonts/Jost-SemiBold.ttf
